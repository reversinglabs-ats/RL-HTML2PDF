[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-html2pdf"
version = "0.1.0"
description = "Render JS-driven HTML reports to PDF using Playwright."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"

keywords = [
  "html-to-pdf",
  "playwright",
  "reversinglabs",
  "report",
]

dependencies = [
  "playwright>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.2",
  "mypy>=1.19.1",
  "ruff>=0.15.10",
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
  "I",
  "UP",
  "B",
]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
