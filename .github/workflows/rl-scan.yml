name: RL Spectra Assure Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write

jobs:
  scan-and-report:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build package
        id: build
        run: |
          mkdir -p ./packages ./rl-reports
          python3 -m pip install --upgrade pip build
          python3 -m build
          cp dist/*.whl ./packages/
          echo "whl_name=$(basename dist/*.whl)" >> "$GITHUB_OUTPUT"

      - name: Scan with rl-scanner
        run: |
          docker run --rm \
            -e RLSECURE_ENCODED_LICENSE=${{ secrets.RLSECURE_ENCODED_LICENSE }} \
            -e RLSECURE_SITE_KEY=${{ secrets.RLSECURE_SITE_KEY }} \
            -v "${{ github.workspace }}/packages:/packages:ro" \
            -v "${{ github.workspace }}/rl-reports:/report" \
            --entrypoint /bin/bash \
            reversinglabs/rl-scanner \
            -c '
              set -e
              rl-deploy install /tmp/__rlsecure --no-tracking \
                --from-cache=/tmp/rl-secure.cache \
                --encoded-key="$RLSECURE_ENCODED_LICENSE" \
                --site-key="$RLSECURE_SITE_KEY"

              cp /packages/${{ steps.build.outputs.whl_name }} /tmp/__rlsecure/

              /tmp/__rlsecure/rl-secure init --rl-store=/tmp/__rlsecure/rlstore

              /tmp/__rlsecure/rl-secure scan --no-tracking \
                --rl-store=/tmp/__rlsecure/rlstore \
                --purl=pkg:rl/rl-html2pdf/rl-html2pdf@${{ github.sha }} \
                --file-path=/tmp/__rlsecure/${{ steps.build.outputs.whl_name }}

              /tmp/__rlsecure/rl-secure report \
                --rl-store=/tmp/__rlsecure/rlstore \
                --purl=pkg:rl/rl-html2pdf/rl-html2pdf@${{ github.sha }} \
                --output-path=/report \
                --format=rl-json

              chmod -R a+rX /report

              echo ""
              echo "=== Scan Results ==="
              /tmp/__rlsecure/rl-secure status \
                --rl-store=/tmp/__rlsecure/rlstore \
                --purl=pkg:rl/rl-html2pdf/rl-html2pdf@${{ github.sha }} \
                --return-status || EXIT_CODE=$?

              exit ${EXIT_CODE:-0}
            '

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rl-scan-report
          path: ./rl-reports/

      - name: Checkout rl-scanner-to-github
        if: always()
        uses: actions/checkout@v6
        with:
          repository: reversinglabs-ats/rl-scanner-to-github
          path: rl-scanner-to-github

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: always()
        run: pip install requests

      - name: Create GitHub issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python rl-scanner-to-github/src/main.py \
            --report ./rl-reports/report.rl.json \
            --metadata-dir rl-scanner-to-github/data/rl-scanner-metadata/data \
            --max-issues 5
