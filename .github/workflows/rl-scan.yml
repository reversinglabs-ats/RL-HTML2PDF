name: RL Spectra Assure Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  issues: write
  statuses: write
  pull-requests: write

jobs:
  scan:
    name: Build and scan
    runs-on: ubuntu-latest
    outputs:
      scan-status: ${{ steps.rl-scan.outputs.status }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build package
        id: build
        run: |
          python -m pip install --upgrade pip build
          python -m build
          echo "scanfile=$(ls dist/*.whl)" >> "$GITHUB_OUTPUT"

      - name: Scan with ReversingLabs
        id: rl-scan
        env:
          RLPORTAL_ACCESS_TOKEN: ${{ secrets.RLPORTAL_ACCESS_TOKEN }}
        uses: reversinglabs/gh-action-rl-scanner-cloud-only@v1
        with:
          artifact-to-scan: ${{ steps.build.outputs.scanfile }}
          rl-portal-server: ${{ vars.RL_PORTAL_SERVER }}
          rl-portal-org: ${{ vars.RL_PORTAL_ORG }}
          rl-portal-group: ${{ vars.RL_PORTAL_GROUP }}
          rl-package-url: rl-html2pdf/rl-html2pdf@${{ github.sha }}
          report-path: rl-reports
          rl-verbose: true

      - name: Upload scan report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: rl-scan-report
          path: rl-reports/
          retention-days: 30

      - name: Report scan status
        if: success() || failure()
        run: |
          echo "Status: '${{ steps.rl-scan.outputs.status }}'"
          echo "Description: '${{ steps.rl-scan.outputs.description }}'"

  create-issues:
    name: Create issues from scan findings
    needs: scan
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Download scan report
        uses: actions/download-artifact@v4
        with:
          name: rl-scan-report
          path: rl-reports

      - name: Locate rl-json report
        id: find-report
        run: |
          report=$(find rl-reports -name "*.rl.json" -type f | head -1)
          if [ -z "$report" ]; then
            echo "::error::No rl-json report found in rl-reports/"
            ls -R rl-reports/
            exit 1
          fi
          echo "report-path=$report" >> "$GITHUB_OUTPUT"

      - name: Checkout rl-scanner-to-github
        uses: actions/checkout@v6
        with:
          repository: reversinglabs-ats/rl-scanner-to-github
          path: rl-scanner-to-github

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Create GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python rl-scanner-to-github/src/main.py \
            --report "${{ steps.find-report.outputs.report-path }}" \
            --metadata-dir rl-scanner-to-github/data/rl-scanner-metadata/data \
            --max-issues 10
