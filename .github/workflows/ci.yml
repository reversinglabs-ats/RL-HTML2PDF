name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Ruff format (check)
        run: |
          ruff format . --check

      - name: Ruff lint (check)
        run: |
          ruff check . --no-fix

      - name: Type-check with mypy
        run: |
          mypy RL-HTML2PDF.py

      - name: Run tests with pytest
        run: |
          pytest

      - name: Notify ats-kb-automation
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GH_ORG_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/reversinglabs-ats/ats-kb-automation/dispatches \
            -d '{"event_type":"repo-updated","client_payload":{"repo":"${{ github.event.repository.name }}"}}'
